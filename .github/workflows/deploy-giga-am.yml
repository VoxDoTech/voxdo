name: Deploy giga-am to HF Space

on:
  push:
    branches: [main]
    paths:
      - "services/giga-am/**"
      - ".github/workflows/deploy-giga-am.yml"
  workflow_dispatch:

env:
  HF_SPACE_REPO: kodermax/giga-am

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git subtree split needs full history

      - name: Split services/giga-am into standalone branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=services/giga-am -b hf-space

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          HF_USER=$(curl -sf -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/whoami-v2 | jq -r .name)
          git push --force \
            "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}.git" \
            hf-space:main
